name: NetGraph Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 • Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify Python and City2Graph versions
        run: |
          python --version
          python -c "import city2graph; print('City2Graph:', getattr(city2graph, '__version__', 'version metadata unavailable'))"

      - name: Run full test suite
        run: pytest -q
